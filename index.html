function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[c]));
}

function fmt(s) {
  return esc(s).replace(/\n/g, '<br>');
}

function ago(t) {
  const s = (Date.now() - t) / 1000;
  if (s < 60) return 'たった今';
  if (s < 3600) return Math.floor(s / 60) + '分前';
  if (s < 86400) return Math.floor(s / 3600) + '時間前';

}

function avatarOf(name) {
  if (name === 'あなた') return '🙂';
  let h = 0;
  for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return AVATARS[h % AVATARS.length];
}

function fill(t, ctx) {
  const n = Math.floor(Math.random() * 38) + 3;
  return t.replace(/\{(\w+)\}/g, (m, key) => {
    if (key === 'n') return n;
    return ctx[key] !== undefined ? ctx[key] : m;
  });
}

const STOP = [
  '質問', '回答', '方法', '自分', '本当', '最近', '今日', '皆さん', '普通', '感じ', '場合', '理由',
  '一番', '相談', '大丈夫', '結局', '全部', '毎日', '毎朝', '毎回', '絶対', '知恵袋', '具体的'
];

function extractKeywords(text) {
  const m = text.match(/[一-龠々〆ヵヶァ-ヴーA-Za-zＡ-Ｚａ-ｚ0-9０-９\-]{2,}/g) || [];
  const res = [];
  m.forEach((w) => {
    if (!STOP.includes(w) && !res.includes(w)) res.push(w);
  });
  return res;
}

function detectType(t) {
  if (/死にたい|消えたい|自殺|生きるのがつら|生きるのが辛|生きていたくない|いなくなりたい/.test(t)) {
    return { type: 'crisis' };
  }
  const W = '[一-龠々ァ-ヴーA-Za-z0-9Ａ-Ｚａ-ｚ]+';
  const ab = t.match(new RegExp('(' + W + ')と(' + W + ')[^。？?]{0,15}?(?:どっち|どちら)'));
  if (ab) return { type: 'ab', A: ab[1], B: ab[2] };
  if (/なぜ|何故|なんで|どうして/.test(t)) return { type: 'why' };
  if (/どうすれば|どうしたら|方法|コツ|やり方|どうやって|教えて/.test(t)) return { type: 'how' };
  if (/おすすめ|オススメ|お勧め|何がいい|どれがいい/.test(t)) return { type: 'recommend' };
  if (/ですか|ますか|でしょうか|べき|ありですか/.test(t)) return { type: 'yesno' };
  return { type: 'general' };
}

function detectCategory(text) {
  let best = 'other';
  let score = 0;
  for (const [key, c] of Object.entries(CATS)) {
    if (!c.re) continue;
    const m = text.match(c.re);
    const s = m ? m.length : 0;
    if (s > score) {
      score = s;
      best = key;
    }
  }
  return best;
}

function randomUser() {
  return { user: rand(NAMES), rank: rand(RANKS) };
}

function generate(title, body, catOverride) {
  const text = title + ' ' + body;
  const t = detectType(title + '。' + body);
  const cat = catOverride || detectCategory(text);

  if (t.type === 'crisis') {
    return {
      cat: 'life',
      crisis: true,
      pending: [
        { kind: 'ai', text: CRISIS_AI, serious: true },
        { kind: 'ans', user: '痴恵袋 運営（今回はマジメ）', rank: '本気モード', text: CRISIS_ANS, likes: 99 }
      ]
    };
  }

  let kws = extractKeywords(title);
  if (!kws.length) kws = extractKeywords(body);
  const k = kws[0] || 'それ';
  const k2 = kws[1] || k;
  const qShort = title.length > 25 ? title.slice(0, 25) + '…' : title;

  const ctx = { k, k2, q: qShort, A: t.A || k, B: t.B || k2 };
  const pickC = Math.random() < 0.5;
  ctx.C = pickC ? ctx.A : ctx.B;
  ctx.D = pickC ? ctx.B : ctx.A;

  const answers = [];

  if (TYPE_ANS[t.type]) {
    const u = randomUser();
    answers.push({ ...u, text: fill(rand(TYPE_ANS[t.type]), ctx) });
  }

  pickN(CATS[cat].answers, 2).forEach((tpl) => {
    const u = randomUser();
    answers.push({ ...u, text: fill(tpl, ctx) });
  });

  const genCount = 2 + Math.floor(Math.random() * 2);
  pickN(GENERIC, genCount).forEach((g) => {
    answers.push({ user: g.u, rank: g.r, text: fill(g.t, ctx) });
  });

  let aiTpl;
  if (AI_TYPE[t.type] && Math.random() < 0.5) {
    aiTpl = AI_TYPE[t.type];
  } else if (CATS[cat].ai.length && Math.random() < 0.6) {
    aiTpl = rand(CATS[cat].ai);
  } else {
    aiTpl = rand(AI_GENERIC);
  }

  const pending = [{ kind: 'ai', text: fill(aiTpl, ctx) }];
  shuffle(answers).forEach((a) => {
    pending.push({ kind: 'ans', ...a, likes: Math.floor(Math.random() * 25) });
  });

  return { cat, crisis: false, pending };
}

/* ===================== 永続化 ===================== */

function save() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state.questions));
  } catch (e) {
    /* 保存失敗しても知恵袋は続く */
  }
}

function load() {
  try {
    const d = JSON.parse(localStorage.getItem(STORE_KEY));
    if (Array.isArray(d) && d.length) return d;
  } catch (e) {
    /* 壊れていたら初期化 */
  }
  return null;
}

function getQ(id) {
  return state.questions.find((q) => q.id === id);
}

/* ===================== 回答の逐次投稿 ===================== */

function runPending(id) {
  if (running.has(id)) return;
  running.add(id);
  const step = () => {
    const q = getQ(id);
    if (!q || !q.pending || !q.pending.length) {
      running.delete(id);
      if (q) {
        q.pending = null;
        save();
        rerenderIf(id);
      }
      return;
    }
    const item = q.pending.shift();
    if (item.kind === 'ai') {
      q.ai = { text: item.text, serious: !!item.serious };
    } else {
      q.answers.push({
        id: uid(),
        user: item.user,
        rank: item.rank,
        text: item.text,
        likes: item.likes || 0,
        best: false,
        time: Date.now()
      });
    }
    save();
    rerenderIf(id);
    setTimeout(step, 1300 + Math.random() * 1800);
  };
  setTimeout(step, 700);
}

/* ===================== アクション ===================== */

function go(view, id) {
  state.view = view;
  state.currentId = id || null;
  if (view === 'detail') {
    const q = getQ(id);
    if (q) {
      q.views++;
      save();
    }
  }
  render();
  window.scrollTo(0, 0);
}

function setFilter(c) {
  state.filter = state.filter === c ? null : c;
  state.view = 'list';
  render();
}

function onSearch(v) {
  state.search = v.trim();
  if (state.view !== 'list') state.view = 'list';
  renderList();
}

function want(id) {
  const q = getQ(id);
  if (!q || q.wanted) return;
  q.wanted = true;
  q.wants++;
  save();
  renderDetail();
}

function nice(qid, aid) {
  const q = getQ(qid);
  const a = q && q.answers.find((x) => x.id === aid);
  if (!a) return;
  if (a.liked) {
    a.liked = false;
    a.likes--;
  } else {
    a.liked = true;
    a.likes++;
  }
  save();
  renderDetail();
}

function report(qid, aid) {
  const q = getQ(qid);
  const a = q && q.answers.find((x) => x.id === aid);
  if (!a) return;
  a.reported = true;
  save();
  renderDetail();
}

function chooseBest(qid, aid) {
  const q = getQ(qid);
  if (!q || q.solved) return;
  const a = q.answers.find((x) => x.id === aid);
  if (!a) return;
  a.best = true;
  q.solved = true;
  q.thanks = rand(THANKS);
  save();
  renderDetail();
  renderSide();
}

function submitAnswer(qid) {
  const el = document.getElementById('myAnswer');
  const err = document.getElementById('ansErr');
  const text = el.value.trim();
  if (text.length < 2) {
    err.textContent = '回答が短すぎます。知恵袋の平均よりはマシですが。';
    return;
  }
  const q = getQ(qid);
  const a = {
    id: uid(), user: 'あなた', rank: '新米回答者', text,
    likes: 0, best: false, time: Date.now(), mine: true
  };
  q.answers.push(a);
  el.value = '';
  save();
  renderDetail();
  setTimeout(() => {
    const qq = getQ(qid);
    const aa = qq && qq.answers.find((x) => x.id === a.id);
    if (!aa) return;
    if (qq.mine) {
      aa.reply = '（運営より）自分で答えるなら、なぜ質問したのですか。';
    } else if (!qq.crisis) {
      aa.reply = '質問者からの返信：' + rand(REPLIES);
    }
    save();
    rerenderIf(qid);
  }, 1800);
}

function randomIdea() {
  const el = document.getElementById('qTitle');
  let idea = rand(IDEAS);
  if (IDEAS.length > 1) {
    while (idea === el.value) idea = rand(IDEAS);
  }
  el.value = idea;
}

function submitQ() {
  const title = document.getElementById('qTitle').value.trim();
  const body = document.getElementById('qBody').value.trim();
  const catSel = document.getElementById('qCat').value;
  const err = document.getElementById('askErr');
  if (title.length < 3) {
    err.textContent = '質問が短すぎます。あなたの忍耐力ほどではありませんが。';
    return;
  }
  const g = generate(title, body, catSel || null);
  const q = {
    id: uid(),
    title,
    body,
    cat: g.cat,
    user: 'あなた',
    time: Date.now(),
    views: 1,
    wants: 0,
    solved: false,
    mine: true,
    crisis: g.crisis,
    ai: null,
    answers: [],
    pending: g.pending
  };
  state.questions.unshift(q);
  save();
  state.view = 'detail';
  state.currentId = q.id;
  render();
  window.scrollTo(0, 0);
  runPending(q.id);
}

function resetAll() {
  localStorage.removeItem(STORE_KEY);
  state.questions = seedQuestions();
  state.filter = null;
  state.search = '';
  document.getElementById('search').value = '';
  save();
  go('list');
}

/* ===================== 描画 ===================== */

function render() {
  renderSide();
  if (state.view === 'ask') renderAsk();
  else if (state.view === 'detail') renderDetail();
  else renderList();
}

function rerenderIf(id) {
  if (state.view === 'detail' && state.currentId === id) renderDetail();
  else if (state.view === 'list') renderList();
  renderSide();
}

function renderList() {
  const view = document.getElementById('view');
  let qs = [...state.questions].sort((a, b) => b.time - a.time);
  if (state.filter) qs = qs.filter((q) => q.cat === state.filter);
  if (state.search) {
    const s = state.search;
    qs = qs.filter((q) => q.title.includes(s) || q.body.includes(s));
  }
  const heading = state.filter
    ? CATS[state.filter].emoji + ' ' + CATS[state.filter].name
    : '🔥 新着の迷質問';

  const items = qs.map((q) => {
    const c = CATS[q.cat] || CATS.other;
    const status = q.solved
      ? '<span class="badge solved">解決済み</span>'
      : '<span class="badge open">回答受付中</span>';
    const mine = q.mine ? '<span class="badge mine">あなたの質問</span>' : '';
    return `
      <div class="qitem" onclick="go('detail','${q.id}')">
        <div class="qtitle">${esc(q.title)}</div>
        <div class="meta">
          ${status}${mine}
          <span class="badge">${c.emoji} ${esc(c.name)}</span>
          <span>💬 回答 ${q.answers.length}</span>
          <span>👀 ${q.views}</span>
          <span>${ago(q.time)}</span>
        </div>
      </div>`;
  }).join('');

  view.innerHTML = `
    <div class="card">
      <div class="list-head">
        <h2>${heading}</h2>
        <button class="btn small" onclick="go('ask')">質問して後悔する</button>
      </div>
      ${items || '<div class="empty">該当する質問はありません。<br>あなたの悩みは、知恵袋ですら扱えないレベルのようです。</div>'}
    </div>`;
}

  return `
    <div class="ans ${a.best ? 'best' : ''}">
      ${a.best ? '<div class="ba">👑 ベストアンサー</div>' : ''}
      <div class="ahead">
        <span class="avatar">${avatarOf(a.user)}</span>
        <b>${esc(a.user)}</b>
        ${a.rank ? `<span class="rank">${esc(a.rank)}</span>` : ''}
        <span class="time">${ago(a.time)}</span>
      </div>
      <div class="atext">${fmt(a.text)}</div>
      ${a.reply ? `<div class="reply">${fmt(a.reply)}</div>` : ''}
      <div class="aact">
        <button class="btn small ${a.liked ? 'liked' : ''}" onclick="nice('${q.id}','${a.id}')">👍 ナイス ${a.likes}</button>
        ${a.reported
          ? '<span class="reported">通報しました。運営は今日も見ていません。</span>'
          : `<button class="btn small" onclick="report('${q.id}','${a.id}')">⚠ 違反報告</button>`}
        ${canBest && !a.mine ? `<button class="btn small primary" onclick="chooseBest('${q.id}','${a.id}')">ベストアンサーに選ぶ</button>` : ''}
      </div>
    </div>`;
}

      <input id="qTitle" type="text" maxlength="100" placeholder="例：なぜ月曜日は毎週来るのですか？">
      <label for="qBody">詳細（任意・書いても読まれません）</label>
      <textarea id="qBody" rows="5" placeholder="ここに詳しい事情を書くと、回答者がそれを無視して自分語りを始めます。"></textarea>
      <label for="qCat">カテゴリ</label>
      <select id="qCat">
        <option value="">🤖 自動判定（AIが雰囲気で決めます）</option>
        ${opts}
      </select>
      <div class="err" id="askErr"></div>
      <div class="row">
        <button class="btn" onclick="randomIdea()">🎲 迷質問を自動生成</button>
        <button class="btn primary" onclick="submitQ()">質問する（後悔はしない）</button>
      </div>
    </div>`;
}

function renderSide() {
  const side = document.getElementById('side');
  const counts = {};
  state.questions.forEach((q) => {
    counts[q.cat] = (counts[q.cat] || 0) + 1;
  });
  const cats = Object.entries(CATS).map(([k, c]) => `
    <li class="${state.filter === k ? 'active' : ''}" onclick="setFilter('${k}')">
      <span>${c.emoji} ${esc(c.name)}</span><span>${counts[k] || 0}</span>
    </li>`).join('');

  const ranking = [...state.questions]
    .filter((q) => !q.crisis)
    .sort((a, b) => b.views - a.views)
    .slice(0, 5)
    .map((q, i) => `
      <li onclick="go('detail','${q.id}')"><span class="rankno">${i + 1}</span>${esc(q.title.length > 30 ? q.title.slice(0, 30) + '…' : q.title)}</li>`)
    .join('');

  const myCount = state.questions.filter((q) => q.mine).length;

  side.innerHTML = `
    <div class="card">
      <h3>あなたのステータス</h3>
      <div class="note">知恵コイン：0枚（価値：0円）</div>
      <div class="note">質問数：${myCount}（後悔数：${myCount}）</div>
      <div class="note">称号：${myCount === 0 ? '傍観者' : myCount < 3 ? '迷える子羊' : myCount < 6 ? '知恵袋依存症' : '人生の大半をここで過ごす人'}</div>
    </div>
    <div class="card">
      <h3>カテゴリ</h3>
      <ul>${cats}</ul>
    </div>
    <div class="card">
      <h3>今日の迷質問ランキング</h3>
      <ul class="rk">${ranking}</ul>
    </div>
    <div class="card">
      <h3>運営からのお知らせ</h3>
      <div class="note">・違反報告は24時間受け付けています（確認は年1回です）</div>
      <div class="note">・AIアシスタントの自信と正確性は反比例します</div>
    </div>`;
}

/* ===================== 起動 ===================== */

(function init() {
  state.questions = load() || seedQuestions();
  save();
  render();
  state.questions.forEach((q) => {
    if (q.pending && q.pending.length) runPending(q.id);
  });
  setInterval(() => {
    if (state.view === 'list') renderList();
  }, 60000);
})();
</script>
</body>
</html>
